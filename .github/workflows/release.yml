name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          mkdir -p out/KANAO-Gaming-Scripts
          cp -r [0-9][0-9]_* KANAO_Menu.cmd README.md out/KANAO-Gaming-Scripts/
          cd out && zip -qr ../KANAO-Gaming-Scripts.zip KANAO-Gaming-Scripts
      - uses: actions/upload-artifact@v4
        with:
          name: KANAO-Gaming-Scripts
          path: KANAO-Gaming-Scripts.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KANAO-Gaming-Scripts.zip
          generate_release_notes: true
